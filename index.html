    <style>
      #qv-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f6f4ef;
        color: #16181f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 220ms ease, visibility 220ms ease;
      }
      @media (prefers-color-scheme: dark) {
        #qv-boot-splash {
          background: #0d0e12;
          color: #f3efe6;
        }
        #qv-boot-splash .qv-boot-sub {
          color: #9ba0ad;
        }
        #qv-boot-splash .qv-boot-track {
          background: rgba(255, 255, 255, 0.12);
        }
      }
      #qv-boot-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #qv-boot-splash .qv-boot-title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #qv-boot-splash .qv-boot-sub {
        font-size: 12.5px;
        color: #5c606b;
      }
      #qv-boot-splash .qv-boot-track {
        width: 148px;
        height: 3px;
        border-radius: 999px;
        background: rgba(22, 24, 31, 0.12);
        overflow: hidden;
      }
      #qv-boot-splash .qv-boot-fill {
        width: 44%;
        height: 100%;
        border-radius: 999px;
        background: #b9893e;
        animation: qvBootSlide 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes qvBootSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
    </style>
