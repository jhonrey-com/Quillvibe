[package]
name = "quillvibe"
version = "3.3.6"
description = "Open-source desktop book writing, worldbuilding, cover studio, and EPUB/PDF typesetting app"
authors = ["jhonrey.com"]
license = "MIT"
edition = "2021"

[lib]
name = "quillvibe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
